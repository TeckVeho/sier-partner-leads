services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: paag
      POSTGRES_PASSWORD: paag
      POSTGRES_DB: paag
    volumes:
      - paag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paag -d paag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paag_pg:
